# alias -> opencode provider/model-id
# Reverse (provider/model-id -> alias) is derived at runtime.
# Each provider/model-id must map to exactly ONE canonical alias for the reverse
# lookup (ModelToClaude) to work deterministically.
aliases:
  sonnet: "anthropic/claude-sonnet-4-6"
  opus: "anthropic/claude-opus-4-7"
  haiku: "anthropic/claude-haiku-4-5-20251001"
